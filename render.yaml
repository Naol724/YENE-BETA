# Render Blueprint — link this repo or create a Web Service with Root Directory: backend
# After create: set the secret env values in the Dashboard (sync: false = you fill them in).
services:
  - type: web
    name: yene-bet-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: MONGODB_USE_PUBLIC_DNS
        value: "false"
